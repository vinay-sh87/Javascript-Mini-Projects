<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="main-container">
      <h1><i class="fa-solid fa-rocket"></i>Calculator</h1>
      <div class="container">
        <div class="input-group">
          <input type="text" id="expr" disabled />
          <div id="preview">0</div>
        </div>

        <div class="buttons">
          <button>C</button>
          <button>%</button>
          <button>/</button>
          <button>*</button>

          <button>7</button>
          <button>8</button>
          <button>9</button>
          <button>-</button>

          <button>4</button>
          <button>5</button>
          <button>6</button>
          <button>+</button>

          <button>1</button>
          <button>2</button>
          <button>3</button>
          <button>0</button>

          <button>.</button>
          <button>=</button>
          <button>←</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <h1><i class="fa-solid fa-cloud-bolt" style="margin-right: 10px;"></i>Weather App</h1>
        <div class="input-group">  
            <input type="text" id="cityName" placeholder="Enter city name...">
            <button id="fetchBtn" type="button">Fetch Weather</button>
        </div>
        <div class="weather-info">
            <div class="icon">
                <img src="weather-app.png" alt="" id="image">
            </div>
            <div class="location">Location</div>
            <div class="info">
                <div class="temp info-item">Temp</div>
                <div class="description info-item">Description</div>
                <div class="humidity info-item">Humidity</div>
                <div class="wind info-item">Wind</div>
                <div class="clouds info-item">Clouds</div>
                <div class="pressure info-item">Pressure</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
